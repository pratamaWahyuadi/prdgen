# defaults.yaml -- template keputusan low-level dengan default EKSPLISIT.
#
# File ini diisi oleh prdgen ketika user memilih SKIP Technical Deep Dive
# (fase 2 discovery). Setiap keputusan low-level tetap harus punya nilai,
# tapi wajib dicatat jujur: value + assumed:true + basis. "AI pakai default
# eksplisit yang tercatat & bisa di-audit" -- asumsi jadi terkontrol,
# bukan tersembunyi.
#
# Nilai default HARUS dihitung dari familiarity tim (jawaban kategori 16
# fase 1), bukan best-practice generik. Kalau tim cuma familiar lib/pq,
# default-nya lib/pq -- bukan pgx.
#
# Catatan: field `basis` wajib menyebut asal-usul nilai:
#   - "familiarity: <jawaban user>"  -> default diambil dari jawaban
#     familiarity tim di fase 1.
#   - "default umum untuk <stack>"   -> hanya kalau familiarity tidak
#     kejawab sama sekali -- dianggap pilihan terakhir, tetap flagged.

stack:
  language: ""        # contoh: "Go 1.22"
  framework: ""       # contoh: "Fiber v2"
  database: ""        # contoh: "PostgreSQL 16"

shared_instances:
  db_driver:
    value: ""         # contoh: "pgx/v5 (native)" atau "lib/pq via database/sql"
    assumed: true
    basis: ""          # contoh: "familiarity: tim sudah 2 tahun pakai lib/pq"
  db_pool:
    value: ""         # contoh: "single shared *pgxpool.Pool via DI (constructor injection), dibuat sekali saat startup"
    assumed: true
    basis: ""         # contoh: "default umum untuk Go + Postgres"
  query_layer:
    value: ""         # contoh: "sqlc dengan target pgx/v5" / "raw SQL manual" / "GORM v2"
    assumed: true
    basis: ""
  migration_tool:
    value: ""         # contoh: "golang-migrate" / "prisma migrate" / "alembic"
    assumed: true
    basis: ""
  cache_client:       # kosongkan (null) kalau tidak ada cache di scope
    value: ""         # contoh: "go-redis v9, satu client shared via DI"
    assumed: true
    basis: ""
  message_queue:      # kosongkan (null) kalau tidak ada MQ di scope
    value: ""         # contoh: "tidak ada -- proses sinkron"
    assumed: true
    basis: ""
  http_client:
    value: ""         # contoh: "satu instance per integrasi eksternal, timeout 10s, retry 3x"
    assumed: true
    basis: ""

conventions:
  error_handling:
    value: ""         # contoh: "sentinel error di package domain + errors.Is; wrap dengan fmt.Errorf %w"
    assumed: true
    basis: ""
  logging:
    value: ""         # contoh: "log/slog JSON ke stdout"
    assumed: true
    basis: ""
  config:
    value: ""         # contoh: "env vars via godotenv, satu struct Config di internal/config"
    assumed: true
    basis: ""

quality:
  testing:
    value: ""         # contoh: "unit test via testing standar + testify assertions; testcontainers untuk repo test"
    assumed: true
    basis: ""
  ci_cd:
    value: ""         # contoh: "GitHub Actions: test + lint di PR"
    assumed: true
    basis: ""

architecture:
  folder_structure:
    value: ""         # contoh: "monolith modular: cmd/ + internal/<domain>/"
    assumed: true
    basis: ""
